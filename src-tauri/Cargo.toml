[package]
name = "lockhere"
version = "0.1.0"
description = "Unbreakable Cross-Platform Vault"
authors = ["Aditya"]
edition = "2021"

[lib]
name = "lockhere_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10.3"
argon2 = "0.5.3"
rand = "0.8.5"
tauri-plugin-dialog = "2"
open = "5.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
