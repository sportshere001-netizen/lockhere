<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LockHere Vault</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f111a; color: #eceff4; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    .screen { display: none; height: 100%; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; color: #ffffff; }
    p.subtext { font-size: 13px; color: #8892b0; margin-bottom: 24px; text-align: center; }
    input { width: 320px; padding: 12px 16px; background: #1a1d2d; border: 1px solid #2e344d; border-radius: 8px; color: #fff; font-size: 14px; margin-bottom: 12px; outline: none; }
    button { padding: 12px 20px; border-radius: 8px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .primary-btn { background: #4f46e5; color: #fff; width: 320px; margin-bottom: 8px; }
    .secondary-btn { background: transparent; color: #8892b0; border: 1px solid #2e344d; }

    #vault-screen { display: none; height: 100%; flex-direction: column; }
    .vault-header { height: 64px; border-bottom: 1px solid #1f2337; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: #141724; }
    .vault-toolbar { height: 56px; border-bottom: 1px solid #1f2337; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: #0f111a; }
    .btn-add { background: #10b981; color: white; padding: 8px 16px; font-size: 13px; }
    .file-table-container { flex: 1; overflow-y: auto; padding: 16px 24px; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
    th { color: #8892b0; font-weight: 500; padding: 10px 14px; border-bottom: 1px solid #1f2337; }
    td { padding: 14px; border-bottom: 1px solid #181b2a; vertical-align: middle; }
    tr:hover td { background: #141724; }
    .file-name-cell { font-weight: 500; color: #fff; display: flex; align-items: center; gap: 10px; }
    .extract-btn { background: transparent; border: 1px solid #3b4261; color: #a9b1d6; padding: 6px 12px; font-size: 12px; border-radius: 6px; }
    .view-btn { background: #3b82f6; color: white; border: none; padding: 6px 12px; font-size: 12px; border-radius: 6px; margin-right: 5px; }
    #toast { position: fixed; bottom: 20px; right: 20px; background: #1e2238; border: 1px solid #333a5c; padding: 12px 20px; border-radius: 8px; font-size: 13px; color: #fff; display: none; z-index: 1000; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    #loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; color: white; }
    .spinner { border: 4px solid rgba(255,255,255,0.1); width: 40px; height: 40px; border-radius: 50%; border-left-color: #4f46e5; animation: spin 1s linear infinite; margin-bottom: 15px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- SETUP -->
  <div id="setup-screen" class="screen">
    <h1>Initialize Vault</h1>
    <input type="password" id="setup-password" placeholder="Create Master Password" />
    <button class="primary-btn" id="btn-create-vault">Create Vault</button>
  </div>

  <!-- LOGIN -->
  <div id="login-screen" class="screen">
    <h1>LockHere Vault</h1>
    <input type="password" id="login-password" placeholder="Enter Master Password" />
    <button class="primary-btn" id="btn-unlock-vault">Unlock Vault</button>
  </div>

  <!-- VAULT -->
  <div id="vault-screen">
    <div class="vault-header">
      <span style="font-weight: 700;">Protected Files (<span id="item-count">0</span>)</span>
      <button class="secondary-btn" id="btn-lock-session" style="padding: 6px 14px;">Lock Session</button>
    </div>
    <div class="vault-toolbar">
      <button class="btn-add" id="btn-pick-files">+ Add Files to Vault</button>
    </div>
    <div class="file-table-container">
      <table>
        <thead><tr><th>Name</th><th>Size</th><th>Original Location</th><th style="text-align: right;">Action</th></tr></thead>
        <tbody id="file-table-body"></tbody>
      </table>
    </div>
  </div>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <h3 id="loading-text">Processing Massive Files...</h3>
  </div>
  <div id="toast"></div>

  <script src="/main.js"></script>
</body>
</html>
